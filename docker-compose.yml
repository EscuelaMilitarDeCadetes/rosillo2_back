services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5433"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py loaddata superusuario_inicial.json && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.stage
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - documentos_data:${DOCUMENTOS_ROOT}

  celery_worker:
    build: .
    command: celery -A config worker --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.stage
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    command: celery -A config beat --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.stage
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  media_data:
  documentos_data: